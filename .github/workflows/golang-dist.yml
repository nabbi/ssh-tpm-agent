name: Create golang vendor dist
# Every tag pushed to this fork gets a release carrying the Gentoo
# ssh-tpm-agent-<version>-deps.tar.xz and -vendor.tar.xz tarballs used by
# app-crypt/ssh-tpm-agent in nabbi/oubliette-overlay. The version is the tag
# without its leading "v", so v1.2.3 unpacks into ssh-tpm-agent-1.2.3/.
on:
  push:
    tags:
      - 'v*'

jobs:
  golang-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create golang dist
        uses: projg2/golang-dist-action@v1
        with:
          dist-filename: ssh-tpm-agent-${{ steps.version.outputs.version }}
          vendor-dir: ssh-tpm-agent-${{ steps.version.outputs.version }}
